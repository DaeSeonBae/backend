spring:
  application:
    name: DSBBackend

  profiles:
    include: local

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  redis:
    host: host.docker.internal
    port: 6379

django:
  server:
    url: http://localhost:8000
